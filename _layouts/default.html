<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <style>
    :root { color-scheme: light dark; --bg: #fdfdfc; --fg: #1d1d1b; --muted: #66665f; --rule: #e2e2dc; --link: #8a5a00; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161614; --fg: #ecece6; --muted: #a3a39a; --rule: #34342f; --link: #e0b04a; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .25rem; }
    h2 { font-size: 1.2rem; margin: 2rem 0 .5rem; }
    a { color: var(--link); }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
    footer { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    {{ content }}
    <hr>
    <footer><a href="https://bitdecaygames.itch.io/">bitDecay Games</a></footer>
  </main>
</body>
</html>
